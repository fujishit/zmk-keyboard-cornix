# Right half (BLE split peripheral) settings.  The left half's settings are in
# cornix_left.conf; the keymap is shared.

# Radio: +8 dBm (the E73 module's PA).  Hardware A/B on 2026-09-18/19 showed
# a few dB better RSSI at the left; it costs a few % of average current.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Split link on the 1M PHY (experiment, 2026-09-24).  Zephyr's host switches
# every connection to 2M as soon as both sides support it
# (CONFIG_BT_AUTO_PHY_UPDATE, host/conn.c), and the nRF52840's receiver is
# ~3-5 dB less sensitive on 2M than on 1M.  With the MacBook between the
# halves the link sits at -75..-85 dBm, right at the 2M cliff, so the extra
# margin matters more than the shorter packets.  Disabling 2M here only
# affects links this half is on, i.e. the split link; the left half keeps
# 2M for the host.
CONFIG_BT_CTLR_PHY_2M=n
