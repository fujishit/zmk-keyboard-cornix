# Central-half only Kconfig.
#
# ZMK's config resolver (zmk/app/boards/post_boards_shields.cmake) appends
# every ZMK_CONFIG/<name>.conf that exists, trying <BOARD_DIR_NAME>.conf,
# <BOARD>.conf and default.conf in that order.  For `-b cornix_left//zmk`
# BOARD_DIR_NAME is "cornix" (both halves live in boards/jzf/cornix) and BOARD
# is "cornix_left"; there is no _left/_right suffix stripping for *boards*
# (that only happens for shields).  So this file is picked up by the LEFT half
# only, which is what we want: the right half builds with CONFIG_ZMK_USB=n and
# CONFIG_ZMK_BLE as a split peripheral, so assigning ZMK_OS_DETECTION_USB
# there would be an unsatisfiable symbol and Zephyr would fail the build.
# (Detection can only run on the central anyway - it is the half that owns the
# USB/BLE host connection.)

# --- Host OS detection (zmk-feature-os-detection, pinned in config/west.yml) --
#
# Detects the host over USB (enumeration fingerprint, observed through a
# linker --wrap of usb_handle_bos) and over BLE (which GATT characteristics
# the host reads during discovery), and raises zmk_os_changed.
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y

# --- Automatic Base/Win layer switch -----------------------------------------
#
# src/os_detection_core.c, os_detection_layer_listener(): on every
# zmk_os_changed it deactivates the layer it activated last and activates the
# layer configured for the new OS; -1 means "no layer", i.e. only deactivate.
# Both layers are toggled with zmk_keymap_layer_{de,}activate(..., false), the
# same call &tog uses, so this is a plain layer state change - nothing is
# stored to settings and nothing survives a reboot.
#
# Base (layer 0) is the Mac-oriented stock layout; layer 1 ("Win") is a
# &trans-filled overlay that only swaps the two bottom-left modifiers, so
# activating it is safe on any host.
CONFIG_ZMK_OS_DETECTION_LAYER_AUTO_SWITCH=y
CONFIG_ZMK_OS_DETECTION_LAYER_WINDOWS=1
CONFIG_ZMK_OS_DETECTION_LAYER_LINUX=1
CONFIG_ZMK_OS_DETECTION_LAYER_MACOS=-1
CONFIG_ZMK_OS_DETECTION_LAYER_IOS=-1
CONFIG_ZMK_OS_DETECTION_LAYER_ANDROID=-1
# Left at its default for clarity: an unknown host falls back to Base.
CONFIG_ZMK_OS_DETECTION_LAYER_UNKNOWN=-1

# --- Behaviour and caveats ---------------------------------------------------
#
# * Which OS is "current" is per *endpoint*: zmk_os_detection_current()
#   (os_detection_core.c) returns the USB result while the USB endpoint is
#   selected and the per-profile BLE result while a BLE profile is selected.
#   The module subscribes to zmk_endpoint_changed and
#   zmk_ble_active_profile_changed, so switching output (&out OUT_USB /
#   OUT_BLE) or BLE profile (&bt BT_SEL n) re-evaluates and re-applies the
#   layer immediately from the value already detected for that endpoint - the
#   switch survives a profile switch, no re-pairing or re-detection needed.
# * Unplugging USB clears the USB result back to UNKNOWN (the module listens
#   to zmk_usb_conn_state_changed), so the Win layer is dropped rather than
#   left stuck on.
# * BLE detection is heuristic and reports live with no debounce of its own
#   beyond CONFIG_ZMK_OS_DETECTION_BLE_SETTLE_MS (default 1000 ms): the
#   upstream README documents a real Windows capture that briefly reported
#   Linux, then macOS, before settling on Windows within about 2 s.  The layer
#   can therefore flap for a second or two right after a BLE (re)connect.
#   Both Windows and Linux map to layer 1 here, which absorbs most of it.
# * Over BLE, Windows and Linux are genuinely indistinguishable (real captures
#   read the identical characteristic set), and the classifier resolves that
#   ambiguity to Windows on purpose.  Harmless here: both want layer 1.
# * Over USB, anything on the Linux USB host stack (desktop Linux, ChromeOS,
#   Android in OTG host mode) reports LINUX, and macOS and iOS are the same
#   Apple stack and both report MACOS.  That matches what we want per layer.
# * BLE detection has no persistence in this build.  The per-profile result
#   lives in RAM only (ble_detected[] in os_detection_core.c); the module can
#   persist and immediately re-adopt it on connect, but only through
#   zmk-feature-custom-settings, which is off here (see below).  The
#   fingerprint is a *GATT discovery* pattern (os_detection_ble.c), and a host
#   that has already cached the keyboard's GATT database usually does not
#   re-read those characteristics when it merely reconnects - so after a
#   keyboard reboot or battery swap a BLE host can stay UNKNOWN, i.e. Base,
#   until it re-discovers or is re-paired.  &tog 1 is the fix in the meantime.
#   USB does not have this problem: every replug re-enumerates.
# * KVM switches and some USB hubs do not force re-enumeration when they
#   switch, so a USB host change can go unnoticed until the next real replug.
# * The module does not know about manual layer changes: it only remembers the
#   layer *it* last activated.  &tog 1 on the Fn3 layer (see
#   config/cornix.keymap) overrides the guess, but the next zmk_os_changed
#   event re-asserts whatever detection believes.
#
# Not enabled on purpose: CONFIG_ZMK_OS_DETECTION_STUDIO_RPC and
# CONFIG_ZMK_CUSTOM_SETTINGS (per-BLE-profile manual overrides + Web UI).
# They ride on an unofficial custom Studio RPC protocol that needs cormoran's
# ZMK fork; this repository builds against upstream zmkfirmware/zmk main.

# --- Pause BLE while the USB endpoint is in use (this module) ---------------
#
# Defined by this repository itself: Kconfig (root) + src/ble_usb_gate.c,
# wired in through zephyr/module.yml (`build: cmake: . / kconfig: Kconfig`).
# Central-only by construction (`depends on ZMK_SPLIT_ROLE_CENTRAL ||
# !ZMK_SPLIT`), so the right half never sees the symbol.
#
# Why: measured on 2026-09-18, while the left half was used over USB on a
# Windows PC all day, the bonded Mac kept trying to reconnect about once a
# second and every attempt died at the encryption step (12 h, 45,910 cycles,
# 0 successes).  That storm eats the central's radio time, and the already
# weak split link to the right half (RSSI -80..-89 dBm) dropped several times
# per minute while typing.  Turning Bluetooth off on the Mac fixed it; this
# does the same automatically, from the keyboard side.
#
# What it does: while the USB endpoint is the one actually carrying keystrokes
# - ZMK's *selected* transport is USB - the central disconnects the active BLE
# profile and keeps its own advertising stopped (it re-stops it after every
# profile event, because ZMK restarts advertising from its own
# connected/disconnected callbacks - see src/ble_usb_gate.c for the ble.c line
# references).  The split link is untouched: that is a *central*-role
# connection and needs no advertising.
#
# The exception is the BLE grace window, and it is what keeps `&out OUT_BLE`
# usable.  With BLE paused there is no BLE host, so ZMK's endpoint selection
# falls back from a preferred BLE to USB (zmk/app/src/endpoints.c,
# get_selected_transport()) and "selected" is USB whatever the user asked for.
# So whenever the *preferred* transport becomes BLE while USB is plugged in -
# `&out OUT_BLE`, the output toggle, or the value restored from settings at
# boot - advertising is allowed for CONFIG_CORNIX_BLE_PAUSE_ON_USB_BLE_GRACE_MS
# (20 s).  If a host connects it becomes the selected endpoint and the gate
# stays open for as long as it is (USB cable as a mere power supply works).  If
# the window expires with nothing connected, the preference is put back to USB
# with zmk_endpoint_set_preferred_transport() - ZMK persists that - and the
# gate closes.
#
# Why not "preferred USB && selected USB", the first version of this rule:
# measured 2026-09-18 20:02, a single `&out OUT_BLE` press to test had been
# persisted as preferred = BLE and restored on every boot, so with the Mac not
# connected the log read "ble gate: preferred 2 selected 1 -> gated 0" forever
# and nothing was ever paused.  A stale preference now only buys one grace
# window before it is rewritten to USB.
#
# `&out` presses only raise zmk_endpoint_changed when the *selected* endpoint
# really changes, which is not the case for `&out OUT_BLE` while typing on USB
# (BLE is held down, so the selection stays USB), for `&out OUT_USB` while USB
# is already the selected fallback, or for the grace window expiring.  So the
# gate re-checks itself every CONFIG_CORNIX_BLE_PAUSE_ON_USB_DELAY_MS for as
# long as USB can carry keystrokes at all, plus while a window is open; it
# stops as soon as USB is unplugged, so it never costs battery.  (Measured
# 2026-09-18 20:09: with an earlier version that only re-checked while the gate
# was closed, `&out OUT_USB` on a USB-selected keyboard produced no `ble gate:`
# line at all.)  `&out OUT_USB` while a BLE host is selected does change the
# selection, so that one also arrives as an event.
#
# Log lines (debug firmware, scripts/log/capture.py):
#   "ble gate: init (preferred N selected N)"   (first work run, after settings
#                                                are loaded - not from SYS_INIT)
#   "ble gate: BLE grace window (20000 ms)"
#   "ble gate: BLE grace window closed (preferred N selected N)"
#   "ble gate: BLE did not connect, preferring USB again"
#   "ble gate: paused (USB active)"  /  "ble gate: resumed"
#
# How to get BLE back:
#   * Hold both right thumb Fn keys (positions 45 and 46, which switches the
#     Conn layer on) and tap position 12 - the CAPS position, `&out OUT_BLE`
#     on the Conn layer (config/cornix.keymap).  `&out OUT_USB` is position 0
#     (TAB) and `&bt BT_CLR` position 24 (Shift) in the same column.  Connect
#     the host within the 20 s window, otherwise press it again.
#   * Or just unplug USB: the endpoint stops being USB and BLE resumes by
#     itself.
#
# Caveats while USB is the selected endpoint:
#   * The BLE host cannot connect at all, so OS detection over BLE (see above)
#     and ZMK Studio over BLE are unavailable.  USB OS detection and Studio
#     over USB are unaffected.
#   * A host that was connected is actively disconnected, so on the Mac the
#     keyboard shows as "not connected" until you switch back.
#   * Using BLE with the cable plugged in only for power needs the host to
#     connect inside the grace window; if it is asleep for longer, the
#     preference falls back to USB and has to be re-asserted with
#     `&out OUT_BLE`.
CONFIG_CORNIX_BLE_PAUSE_ON_USB=y
# Settle time before pausing/resuming, the watchdog period while USB is ready
# or a grace window is open, and the re-check delay after ZMK restarts
# advertising from its disconnected() callback.
CONFIG_CORNIX_BLE_PAUSE_ON_USB_DELAY_MS=500
# How long advertising is allowed after the user (or a restored setting) asks
# for BLE while USB is plugged in, before the preference is reset to USB.
CONFIG_CORNIX_BLE_PAUSE_ON_USB_BLE_GRACE_MS=45000

# Split link peripheral latency (2026-09-21). The user measured on hardware
# that ZMK's default of 30 makes the right half feel laggy while 0 does not,
# so make the value explicit instead of relying on -D flags in local builds.
# Cost: the right half listens on every 7.5 ms connection event, which cuts
# its idle battery life from months to weeks (see config/POWER.md); a middle
# ground would be CONFIG_ZMK_SPLIT_BLE_PREF_INT=12 with latency 0.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
