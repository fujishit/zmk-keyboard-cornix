name: Keymap cheat sheet

# config/cheatsheet.html is generated from config/cornix.keymap by
# scripts/cheatsheet.py and committed, so it can be opened straight from the
# repo.  On a push to main this workflow regenerates it and commits the result
# back; on a pull request it only checks that the committed file is current.

on:
  push:
    branches:
      - main
    paths:
      - "config/cornix.keymap"
      - "boards/jzf/cornix/cornix-layouts.dtsi"
      - "scripts/cheatsheet.py"
      - "scripts/remap.py"
      - ".github/workflows/cheatsheet.yml"
  pull_request:
    paths:
      - "config/cornix.keymap"
      - "config/cheatsheet.html"
      - "boards/jzf/cornix/cornix-layouts.dtsi"
      - "scripts/cheatsheet.py"
      - "scripts/remap.py"
      - ".github/workflows/cheatsheet.yml"
  workflow_dispatch:

concurrency:
  group: cheatsheet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the footer stamp is the keymap's last commit
          fetch-depth: 0
      - name: Regenerate config/cheatsheet.html
        run: python3 scripts/cheatsheet.py
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- config/cheatsheet.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- config/cheatsheet.html
          fi
      - name: Fail the pull request when the committed sheet is stale
        if: github.event_name == 'pull_request' && steps.diff.outputs.changed == 'true'
        run: |
          echo "::error file=config/cheatsheet.html::config/cheatsheet.html is out of date; run 'just cheatsheet' (python3 scripts/cheatsheet.py) and commit it"
          exit 1
      - name: Commit the regenerated sheet
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/cheatsheet.html
          git commit -m "docs: regenerate keymap cheat sheet [skip ci]" \
            -m "Generated by scripts/cheatsheet.py from config/cornix.keymap @ ${GITHUB_SHA::7}."
          git push
