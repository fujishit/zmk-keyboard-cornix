name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      # Recursive: "boards/*" matched neither boards/jzf/cornix/* nor
      # boards/shields/**, so a firmware change never triggered this build.
      - "boards/**"
      - "config/**"
      - "src/**"
      - "dts/**"
      - "snippets/**"
      - "zephyr/**"
      - "Kconfig"
      - "CMakeLists.txt"
      - "build.yaml"
      - ".github/workflows/build.yml"
    # A push trigger that lists only tags-ignore never fires for branch
    # pushes (GitHub: "if you define only tags/tags-ignore, the workflow
    # won't run for events affecting branches"), which is why this build
    # was only ever started by hand.  Name the branches explicitly.
    branches:
      - "**"
    tags-ignore:
      - "*"

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main