name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      # Recursive: "boards/*" matched neither boards/jzf/cornix/* nor
      # boards/shields/**, so a firmware change never triggered this build.
      - "boards/**"
      - "config/**"
      - "src/**"
      - "dts/**"
      - "snippets/**"
      - "zephyr/**"
      - "Kconfig"
      - "CMakeLists.txt"
      - "build.yaml"
      - ".github/workflows/build.yml"
    tags-ignore:
      - "*"

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main