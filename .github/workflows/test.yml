name: Hardware-free tests

on:
  push:
    paths:
      - "boards/**"
      - "config/**"
      - "snippets/**"
      - "scripts/**"
      - "tests/**"
      - "src/**"
      - "Kconfig"
      - "CMakeLists.txt"
      - "build.yaml"
      - "build-debug.yaml"
      - ".github/workflows/test.yml"
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: Static config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate boards, shields, build matrices and keymaps
        run: python3 scripts/check_config.py
      # The same list `just check-test` runs, so the two cannot drift apart.
      # tests/bsim is in it but skips itself here: BabbleSim (32-bit
      # toolchain) is not installed on the runner, so it only runs locally,
      # via `just check-test` or `just bsim-test`.
      - name: Unit tests (every suite under tests/)
        run: scripts/unit_tests.sh

  sim:
    name: Keymap simulation (native_sim)
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
        with:
          path: cornix
      - name: Cache west workspace
        uses: actions/cache@v4
        with:
          path: |
            ws/.west
            ws/modules
            ws/zephyr
            ws/zmk
            ws/zmk-helpers
          key: sim-ws-${{ hashFiles('cornix/config/west.yml') }}
      - name: Prepare west workspace
        # The repo root already contains a zephyr/ module directory, so the
        # workspace topdir must be a separate directory (not the checkout).
        #
        # ws/.west is cached together with the projects, so a cache hit is a
        # complete workspace and `west update` (several minutes of fetching)
        # can be skipped.  `west zephyr-export` cannot: it writes the Zephyr
        # CMake package into ~/.cache, which is outside the cache.
        run: |
          mkdir -p ws
          rm -rf ws/config && cp -r cornix/config ws/config
          cd ws
          if [ ! -d .west ]; then
            west init -l config
            west update --narrow --fetch-opt=--filter=tree:0
          fi
          west zephyr-export
      - name: Run simulation tests
        run: SIM_WS="$GITHUB_WORKSPACE/ws" cornix/scripts/sim/run.sh --verbose
      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs
          path: cornix/.build/sim/**/*.log
          if-no-files-found: ignore
