name: Build debug firmware (USB logging)
# Builds build-debug.yaml: every Cornix role with the `zmk-usb-logging` and
# `cornix-debug-log` snippets. Manual trigger, or push to a `debug/**` branch.
on:
  workflow_dispatch:
  push:
    branches:
      - "debug/**"

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: build-debug.yaml
      archive_name: firmware-debug
