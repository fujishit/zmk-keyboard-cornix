# native_sim has CONFIG_ZMK_BLE=n, so nothing selects BT_ECC and therefore
# nothing selects mbedTLS/PSA either.  Turn the PSA provider on directly:
# MBEDTLS_PSA_CRYPTO_C enables MBEDTLS_PSA_CRYPTO_CLIENT -> PSA_CRYPTO_CLIENT,
# which is what CONFIG_CORNIX_CRYPTO_SELFTEST depends on and what makes its
# PSA_WANT_ALG_ECDH / PSA_WANT_ALG_CMAC / PSA_WANT_KEY_TYPE_* selects effective
# (zephyr/modules/mbedtls/Kconfig.tls-generic:547-563, Kconfig.psa.auto).
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
# mbedTLS needs its heap for the generic ECP path.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=32768

CONFIG_CORNIX_CRYPTO_SELFTEST=y
# No USB console to wait for here, and the mock kscan ends the run a few
# hundred simulated milliseconds after the last key event - so do not wait.
CONFIG_CORNIX_CRYPTO_SELFTEST_DELAY_MS=0
