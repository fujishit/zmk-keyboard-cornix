# config/cornix.keymap uses &mkp on the inner right key and &inc_dec_msc on
# the right encoder, both of which need ZMK's pointing support.
CONFIG_ZMK_POINTING=y

# This case needs no OS detection: the Win layer is switched on through the
# keymap's own manual fallback (`&tog 1` on Fn3), which is all `&app_tab`
# cares about.  CONFIG_CORNIX_APP_SWITCH defaults to y for a non-split build,
# so nothing has to be set here for the behavior itself.
