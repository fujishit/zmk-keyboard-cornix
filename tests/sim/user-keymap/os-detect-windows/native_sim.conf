# config/cornix.keymap uses &mkp on the inner right key and &inc_dec_msc on
# the right encoder, both of which need ZMK's pointing support.
CONFIG_ZMK_POINTING=y

# zmk-feature-os-detection, configured exactly as config/cornix_left.conf does
# for the real central, except for the two test-only lines below.
CONFIG_ZMK_USB=y
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
# native_sim//zmk_test_mock builds with CONFIG_ZMK_BLE=n, and
# ZMK_OS_DETECTION_BLE depends on ZMK_BLE; the BLE classifier cannot be
# exercised here at all (no controller, no GATT client).
CONFIG_ZMK_OS_DETECTION_BLE=n
CONFIG_ZMK_OS_DETECTION_LAYER_AUTO_SWITCH=y
CONFIG_ZMK_OS_DETECTION_LAYER_WINDOWS=1
CONFIG_ZMK_OS_DETECTION_LAYER_LINUX=1
CONFIG_ZMK_OS_DETECTION_LAYER_MACOS=-1
CONFIG_ZMK_OS_DETECTION_LAYER_IOS=-1
CONFIG_ZMK_OS_DETECTION_LAYER_ANDROID=-1
CONFIG_ZMK_OS_DETECTION_LAYER_UNKNOWN=-1

# Test-only: native_sim has no USB device controller, so the module replays
# recorded SETUP sequences through zmk_os_detection_observe_setup() at boot
# (src/os_detection_usb.c, os_detection_test_inject_init).
CONFIG_ZMK_OS_DETECTION_TEST_INJECT=y
CONFIG_ZMK_OS_DETECTION_USB_SETTLE_MS=10
