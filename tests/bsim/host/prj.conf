# The simulated host computer (the "Mac") for the three-device Cornix
# BabbleSim simulation: a GATT client that connects to the ZMK central's HID
# service and subscribes to its input reports.

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="bsim host"

# The ZMK central's HID characteristics are BT_GATT_PERM_*_ENCRYPT, so the
# link has to be paired before the CCC can be written. No IO capabilities ->
# just-works, which is what ZMK's auth_pairing_accept() allows for an open
# profile (zmk/app/src/ble.c).
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_SMP_MIN_ENC_KEY_SIZE=16
# ZMK's central has CONFIG_BT_SMP_ENFORCE_MITM=y, but with NoInputNoOutput on
# both sides the MITM bit is cleared and just-works is used.

# Enough subscriptions for ZMK's keyboard / consumer / mouse input reports.
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=n
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_RX_SIZE=69

# The host does not need to advertise.
CONFIG_BT_PERIPHERAL=n

# Immediate logging so a log timestamp is the simulated time of the event.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=y
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_CONN_LOG_LEVEL_INF=y

CONFIG_ASSERT=y
