# Cornix split BLE *central* (left half) on nrf52_bsim.
#
# The roles / stripped-peripherals / logging settings the peripheral images
# share with this one live in ../_common/bsim.conf, which scripts/bsim/run.sh
# passes as -DEXTRA_CONF_FILE.
#
# CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY is deliberately NOT set here: the runner
# passes -DCONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=<N> per build variant.

CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# The advertised name the simulated host (tests/bsim/host) filters on. ZMK's
# app/Kconfig defaults CONFIG_BT_DEVICE_NAME to this.
CONFIG_ZMK_KEYBOARD_NAME="Cornix Left"
