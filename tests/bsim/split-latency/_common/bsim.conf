# Everything the three split-latency cases (central, peripheral,
# peripheral-fast) agree on.  scripts/bsim/run.sh passes it to every ZMK image
# as -DEXTRA_CONF_FILE, so each case directory's own nrf52_bsim.conf carries
# only what makes it that case.

# --- roles -------------------------------------------------------------
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y

# --- nothing the simulated nRF52833 has no model for -------------------
CONFIG_ZMK_USB=n
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=600000

# --- logging -----------------------------------------------------------
# Immediate mode so that the log timestamp is the simulated time at which the
# event happened, not the time a deferred flush thread got to it. Printing
# costs no simulated time on the native simulator, so it does not perturb the
# measurement.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
# le_param_updated() / "New connection params" and the connection lifecycle
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_CONN_LOG_LEVEL_INF=y
