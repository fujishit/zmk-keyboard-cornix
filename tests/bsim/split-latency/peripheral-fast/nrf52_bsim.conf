# Cornix split BLE *peripheral* (right half) on nrf52_bsim.
#
# The roles / stripped-peripherals / logging settings this shares with the
# central and the other peripheral scenario live in ../_common/bsim.conf,
# which scripts/bsim/run.sh passes as -DEXTRA_CONF_FILE.  Only the keymap
# (nrf52_bsim.keymap) differs between the peripheral scenarios.

CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
