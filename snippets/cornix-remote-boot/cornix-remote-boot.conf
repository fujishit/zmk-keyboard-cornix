# cornix-remote-boot: put either half into the UF2 bootloader from the host.
#
# See the CONFIG_CORNIX_REMOTE_BOOT help text in the repository root Kconfig and
# the "Remote bootloader entry" section of scripts/FLASHING.md.
#
#   1200 bps on the CDC console -> this half enters its UF2 bootloader
#   2400 bps                    -> the split peripheral (right half) does
#   4800 bps                    -> plain cold reset of this half
#
# The symbol `select`s CDC_ACM_DTE_RATE_CALLBACK_SUPPORT
# (zephyr/subsys/usb/device/class/Kconfig.cdc:55) and depends on USB_CDC_ACM,
# which CONFIG_ZMK_USB_LOGGING provides - so use this together with ZMK's
# `zmk-usb-logging` snippet.
CONFIG_CORNIX_REMOTE_BOOT=y
