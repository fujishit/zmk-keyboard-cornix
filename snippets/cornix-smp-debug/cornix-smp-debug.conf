# cornix-smp-debug: turn the Security Manager into a talkative witness.
#
# Use when LE Secure Connections pairing ends in `Security failed ... err 1`
# (BT_SECURITY_ERR_AUTH_FAIL).  That code is what
# zephyr/subsys/bluetooth/host/smp.c security_err_get() returns for BOTH
# BT_SMP_ERR_CONFIRM_FAILED and BT_SMP_ERR_DHKEY_CHECK_FAILED, and the place
# that produces the latter on a peripheral -
# compute_and_check_and_send_periph_dhcheck(), "compare received E with
# calculated remote" - is just
#
#     if (memcmp(smp->e, re, 16)) {
#             return BT_SMP_ERR_DHKEY_CHECK_FAILED;
#     }
#
# with no log line at all.  At the default verbosity there is therefore nothing
# to tell the two failures apart, and nothing to show which pairing method was
# negotiated.  The three modules below fill that in.
#
# Every symbol was checked against the sources ZMK main builds with
# (zmk main -> zephyr v4.1.0+zmk-fixes):
#   [BL] zephyr/subsys/bluetooth/Kconfig.logging (+ Kconfig.template.log_config)
#   [BC] zephyr/subsys/bluetooth/crypto/CMakeLists.txt
#
# Stack it on top of the other two debug snippets - it only adds Kconfig:
#
#   west build -b cornix_left//zmk \
#       -S "zmk-usb-logging cornix-debug-log cornix-smp-debug" ...
#
# It overrides the CONFIG_BT_SMP_LOG_LEVEL_INF / CONFIG_BT_KEYS_LOG_LEVEL_INF
# of cornix-debug-log, so list cornix-smp-debug *after* it.

# --- Security Manager Protocol ------------------------------------------------
# [BL] `if BT_SMP` / module = BT_SMP -> BT_SMP_LOG_LEVEL_DBG.
# What DBG adds in host/smp.c, in the order a pairing produces it:
#   smp_pairing_req()  "req: io_capability 0x%02X, oob_flag 0x%02X,
#                       auth_req 0x%02X, max_key_size 0x%02X,
#                       init_key_dist 0x%02X, resp_key_dist 0x%02X"
#   smp_pairing_rsp()  "rsp: ..." (same fields)
#       -> these two are what decides the method: get_pair_method() maps the
#          two io_capability values through the SMP table to JUST_WORKS /
#          PASSKEY_DISPLAY / PASSKEY_INPUT / PASSKEY_CONFIRM, and
#          auth_req bit 3 (SC) / bit 2 (MITM) says whether LE Secure
#          Connections and MITM protection were asked for.  The method itself
#          is stored in smp->method and is NOT logged (only
#          `LOG_ERR("Unknown pairing method (%u)")` ever prints it), so read it
#          off these two lines - and off ZMK's own auth callbacks in
#          zmk/app/src/ble.c (`auth_passkey_entry`, `auth_pairing_accept`).
#   smp_public_key() / smp_public_key_slave()   entry traces, plus
#                      "Remote is using Debug Public key" (INF) and
#                      "Received invalid public key" (WRN, = the peer's key
#                      failed bt_pub_key_is_valid(), answered with
#                      BT_SMP_ERR_INVALID_PARAMS, not AUTH_FAIL)
#   smp_pairing_confirm() / smp_pairing_random()  entry traces, one pair per
#                      passkey round (20 rounds for Passkey Entry, 1 for Just
#                      Works)
#   bt_smp_dhkey_ready() "%p"
#   smp_dhkey_check()  entry trace - on a peripheral the *last* DBG line before
#                      an AUTH_FAIL, which is how you see that the DHKey check
#                      and not the confirm value was the step that failed
#   smp_pairing_complete() "got status 0x%x"
#   plus "Refusing new pairing. The old bond must be unpaired first." (WRN),
#   "New auth requirements: 0x%x, repairing" (INF), "SMP Timeout" (WRN).
CONFIG_BT_SMP_LOG_LEVEL_DBG=y

# --- Cryptographic toolbox (f4 / f5 / f6 / g2) --------------------------------
# [BL] `if BT_CRYPTO` / module = BT_CRYPTO -> BT_CRYPTO_LOG_LEVEL_DBG.
# subsys/bluetooth/crypto/bt_crypto.c prints the inputs and the output of the
# very functions whose result the peer rejects:
#   bt_crypto_f4()  "u %s" / "v %s" / "x %s z 0x%x" then "res %s"
#                   (the pairing confirm value Ca/Cb)
#   bt_crypto_f5()  "w %s" (= the ECDH shared secret / DHKey!) / "n1" / "n2",
#                   then "t %s", "mackey %1s", "ltk %s"
#   bt_crypto_f6()  "w" / "n1" / "n2" / "r" / "io_cap %s" / "a1 %s" / "a2 %s",
#                   then "res %s" (the DHKey check value Ea/Eb)
#   bt_crypto_g2()  "u" / "v" / "x" / "y", then "res %s" and "passkey %u"
#                   (the 6-digit numeric comparison value)
# `w` in the f5 line is the DHKey: if it differs between the two sides, every
# later value differs too and the peer answers DHKEY_CHECK_FAILED.  Comparing
# the two f6 "res" values (ours, and the `e` the peer sent) is the direct
# answer to "was it the DHKey check?".
#
# [BC] subsys/bluetooth/crypto/CMakeLists.txt raises a CMake WARNING for this
# symbol, and it is right: the log then contains the Long Term Key and the
# DHKey in clear.  This is a debug build for a keyboard that is being re-paired
# anyway - do not publish the capture, and go back to the release firmware when
# the investigation is over.
CONFIG_BT_CRYPTO_LOG_LEVEL_DBG=y

# --- Key storage --------------------------------------------------------------
# [BL] module = BT_KEYS -> BT_KEYS_LOG_LEVEL_DBG.
# host/keys.c at DBG adds "Stored keys for %s (%s)", "Successfully restored keys
# for %s" and "Cleared keys for %s", i.e. whether a pairing that *did* complete
# actually reached flash, plus every bt_keys_find*/bt_keys_get_addr lookup.  The
# lookups are noisy while the central scans for the other half, which is why the
# base cornix-debug-log snippet keeps this module at INF and only this snippet
# raises it.
CONFIG_BT_KEYS_LOG_LEVEL_DBG=y

# --- Deliberately NOT enabled -------------------------------------------------
# * CONFIG_BT_ECC_LOG_LEVEL_DBG does not exist.  `bt_ecc`
#   (zephyr/subsys/bluetooth/host/ecc.c) and `bt_host_crypto`
#   (host/crypto_psa.c) both register with
#   `#define LOG_LEVEL CONFIG_BT_HCI_CORE_LOG_LEVEL`, so they have no module
#   symbol of their own.  Their diagnostics - "Failed to generate ECC key %d",
#   "Raw key agreement failed %d", "psa_import_key() returned status %d",
#   "psa_generate_random() failed %d" - are LOG_ERR and therefore already
#   visible at the INF level the base snippet sets.  Raising BT_HCI_CORE to DBG
#   to get more would log every HCI buffer and drown the capture.
#   To check ECDH *positively* instead of by absence of errors, build with
#   CONFIG_CORNIX_CRYPTO_SELFTEST=y (root Kconfig): it verifies P-256/ECDH
#   against RFC 5903 and AES-CMAC against RFC 4493 through the same PSA calls,
#   and prints `crypto selftest: ... PASS|FAIL` lines a few seconds after boot.
# * CONFIG_BT_CONN_LOG_LEVEL_DBG would add the encryption state machine around
#   the failure, but host/conn.c at DBG also traces every ACL buffer; on a
#   central with a 7.5 ms split link that is enough traffic to push the SMP
#   lines out of the log buffer.  The base snippet's INF level already keeps
#   the connect/disconnect and "Security failed" lines.
