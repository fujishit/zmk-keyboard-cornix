# cornix-debug-log: Kconfig for USB CDC-ACM debug logging on every Cornix role.
#
# Every symbol below was checked against the sources ZMK main builds with
# (zmk main -> zephyr v4.1.0+zmk-fixes, see zmk/app/west.yml):
#   [ZK]  zmk/app/Kconfig
#   [LP]  zephyr/subsys/logging/Kconfig.processing
#   [LM]  zephyr/subsys/logging/Kconfig.mode
#   [LF]  zephyr/subsys/logging/Kconfig.formatting
#   [BL]  zephyr/subsys/bluetooth/Kconfig.logging (+ Kconfig.template.log_config)
#   [CDC] zephyr/subsys/usb/device/class/Kconfig.cdc
#
# --- USB CDC-ACM log port -----------------------------------------------------
# [ZK] `config ZMK_USB_LOGGING` selects LOG, USB, USB_DEVICE_STACK, USB_CDC_ACM,
# SERIAL, CONSOLE, UART_CONSOLE, USB_UART_CONSOLE. It does NOT depend on
# ZMK_USB, so the right half keeps CONFIG_ZMK_USB=n (no USB HID) and still
# enumerates a CDC-ACM log port: zmk/app/CMakeLists.txt compiles src/usb.c
# (the usb_enable() call) under CONFIG_USB_DEVICE_STACK, and Zephyr's
# USB_NRFX driver defaults to y whenever the `usbd` node is enabled in DT
# (nrf_e73.dtsi labels it zephyr_udc0 for all three Cornix boards).
CONFIG_ZMK_USB_LOGGING=y
# [CDC] ZMK sets 1024 under ZMK_USB_LOGGING; a larger ring buffer lets the log
# thread hand bursts of lines to the CDC endpoint without stalling.
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096

# --- Verbosity ---------------------------------------------------------------
# [ZK] module = ZMK + Kconfig.template.log_config -> ZMK_LOG_LEVEL_DBG.
# The analyzer (scripts/log/analyze_latency.py) relies on these <dbg> zmk lines
# (function-name prefix included, see LOG_FUNC_NAME_PREFIX_DBG below):
#   peripheral: kscan_matrix_read: "Sending event at R,C state on|off"
#               zmk_physical_layouts_kscan_process_msgq:
#                   "Row: R, col: C, position: P, pressed: true|false"
#               split_peripheral_listener: ""            (event handed to split)
#               le_param_updated: "<addr>: interval I latency L timeout T"
#   central:    split_central_notify_func: "[NOTIFICATION] data 0x.. length N"
#               peripheral_event_work_callback:
#                   "Trigger key position state change of type T"
#               zmk_keymap_apply_position_state:
#                   "layer_id: L position: P, binding name: B"
#               hid_listener_keycode_pressed|released:
#                   "usage_page 0x.. keycode 0x.. implicit_mods .. explicit_mods .."
#               split_central_process_connection:
#                   "New connection params: Interval: I, Latency: L, PHY: P"
#   warnings:   "Position state message queue full ...", "Error notifying %d",
#               "Keyboard message queue full ...", "FAILED TO SEND OVER ...",
#               "Disconnected ...", "Failed to ...".
CONFIG_ZMK_LOG_LEVEL_DBG=y
# [LF] default y; the analyzer keys on the "<func>: " prefix of <dbg> lines.
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=y

# Bluetooth host: INF is enough for connect/disconnect and "Send LE param
# update failed" warnings without per-packet noise. Connection parameters are
# already printed by ZMK's own le_param_updated / connected callbacks (above).
# [BL] module = BT / BT_CONN / BT_HCI_CORE -> *_LOG_LEVEL_INF.
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_CONN_LOG_LEVEL_INF=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_INF=y
# Pairing / bonding / settings diagnostics (scripts/log/analyze_ble.py).
# [BL] module = BT_SMP (if BT_SMP), BT_KEYS, BT_SETTINGS (if BT_SETTINGS)
#      -> BT_SMP_LOG_LEVEL_INF, BT_KEYS_LOG_LEVEL_INF, BT_SETTINGS_LOG_LEVEL_INF.
# INF keeps the WRN/ERR lines the analyzer decodes, e.g.
#   bt_smp:      "pairing failed (peer reason 0x%x)", "SMP Timeout",
#                "Refusing new pairing. The old bond must be unpaired first."
#   bt_keys:     "Failed to save keys (err %d)", "Keys for %s have no aging counter"
#   bt_settings: "Failed to read ID address from storage", "Unable to setup an
#                identity address", "settings_subsys_init failed (err %d)"
#   bt_hci_core: "Identity: <addr>" (INF, printed at BT init; IRKs are only
#                printed with CONFIG_BT_LOG_SNIFFER_INFO, which stays off)
CONFIG_BT_SMP_LOG_LEVEL_INF=y
CONFIG_BT_KEYS_LOG_LEVEL_INF=y
CONFIG_BT_SETTINGS_LOG_LEVEL_INF=y
# Opt-in: "Stored keys for", "Successfully restored keys for", "Cleared keys
# for" are DBG in bt_keys, but DBG also logs every IRK lookup while the central
# is scanning, so it is off by default.
# CONFIG_BT_KEYS_LOG_LEVEL_DBG=y
# zephyr/subsys/settings/Kconfig: module = SETTINGS -> SETTINGS_LOG_LEVEL_DBG.
# DBG prints one "set-value OK. key: <name>" line per settings key loaded at
# boot (bt/keys/<addr>, bt/id, ble/profiles/N, ...), which is how the analyzer
# counts the bonds actually present in flash; "set-value failure. key: ..."
# is ERR. Boot-only, so it does not affect latency measurements.
CONFIG_SETTINGS_LOG_LEVEL_DBG=y
# Opt-in: PHY update completion is only logged at DBG by
# zephyr/subsys/bluetooth/host/hci_core.c le_phy_update_complete()
# ("PHY updated: status: 0x%02x %s, tx: %u, rx: %u"). BT_HCI_CORE at DBG also
# logs every HCI buffer, which skews latency numbers, so it is off by default.
# CONFIG_BT_HCI_CORE_LOG_LEVEL_DBG=y

# --- Keep logging off the hot path -------------------------------------------
# [LM] Deferred mode: LOG_* calls only copy the message into a buffer; a
# low-priority thread formats and pushes it out later.
CONFIG_LOG_MODE_DEFERRED=y
# [LP] Prefer speed over size for the log frontend.
CONFIG_LOG_SPEED=y
# [LP] ZMK defaults to 8192 under ZMK_USB_LOGGING; 16 KiB absorbs a burst of
# key events plus BT/USB chatter without dropping (range 128..1048576).
CONFIG_LOG_BUFFER_SIZE=16384
# [LP] Drop the oldest message instead of blocking the calling thread when the
# buffer is full (default y; stated explicitly because blocking would add
# latency to the very path we are measuring).
CONFIG_LOG_MODE_OVERFLOW=y
# [LP] Flush interval of the log thread (ZMK default 100). Lower = lines reach
# the host sooner, which tightens the host-side timestamps used by the analyzer
# for cross-device correlation.
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=50
# [LP] Hold early boot lines a bit longer so the host can attach and still see
# the split (re)connection sequence (ZMK default 1000).
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=2000

# --- Timestamps --------------------------------------------------------------
# [LP] 64-bit timestamps: no wrap of the device clock during a long capture.
CONFIG_LOG_TIMESTAMP_64BIT=y
# [LF] Format "[hh:mm:ss.mmm,uuu]" (default when the UART backend formats the
# timestamp; stated explicitly because the analyzer's regex expects it).
CONFIG_LOG_OUTPUT_FORMAT_TIME_TIMESTAMP=y

# --- Remote bootloader entry --------------------------------------------------
# Every debug image should be re-flashable without touching the keyboard: with
# this on, opening the CDC console at 1200 bps enters the UF2 bootloader, 2400
# forwards the request to the right half over the split link and 4800 is a plain
# reset (scripts/flash.py --enter, scripts/FLASHING.md). Same symbol as the
# standalone `cornix-remote-boot` snippet; it depends on USB_CDC_ACM, which
# CONFIG_ZMK_USB_LOGGING above already selects.
CONFIG_CORNIX_REMOTE_BOOT=y
