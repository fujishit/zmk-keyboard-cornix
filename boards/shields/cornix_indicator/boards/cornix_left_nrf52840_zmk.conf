# File name note: Zephyr looks for <board>_<soc>_<variant>.conf here (or the
# shortened <board>_<variant>.conf), never a bare <board>.conf - see
# zephyr_build_string() in zephyr/cmake/modules/extensions.cmake.  For
# `-b cornix_left//zmk` that is cornix_left_nrf52840_zmk.conf.

# Left half (split central), RMK layout:
#   outer/left LED  = Bluetooth profile indicator
#   inner/right LED = battery
#
# The widget indexes LEDs along the WS2812 chain (ws2812@0, chain-length = 2).
# If the two LEDs come out swapped on your unit, exchange the two values
# below - that is the only thing that has to change.
CONFIG_RGBLED_WIDGET_CONN_LED_INDEX=0
CONFIG_RGBLED_WIDGET_BATTERY_LED_INDEX=1
# No dedicated layer LED (layer indication is off anyway); an index >=
# LED_COUNT simply means "no LED of its own".
CONFIG_RGBLED_WIDGET_LAYER_LED_INDEX=2
