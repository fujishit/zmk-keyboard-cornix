# Right half (split peripheral), RMK layout:
#   inner/left LED  = battery
#   outer/right LED = link to the left half
#
# This is the module's default assignment; it is spelled out so that the two
# halves can be read side by side.  Swap the values if your LEDs come out
# mirrored.
CONFIG_RGBLED_WIDGET_BATTERY_LED_INDEX=0
CONFIG_RGBLED_WIDGET_CONN_LED_INDEX=1
CONFIG_RGBLED_WIDGET_LAYER_LED_INDEX=2
