# Cornix RGB indicators - settings shared by both halves.
#
# Backed by hitsmaxft/zmk-rgbled-widget (pinned in config/west.yml), the
# WS2812 fork of caksoylar/zmk-rgbled-widget.  README.md in this directory has
# the full RMK -> ZMK behaviour mapping.
#
# Which LED shows what is board specific and lives in
# boards/<board>_nrf52840_zmk.conf.
#
# Colour indices used below (from the module's Kconfig):
#   0 off  1 red  2 green  3 yellow  4 blue  5 magenta  6 cyan  7 white
#
# Note: Kconfig fragments do not support trailing comments - a `# ...` after a
# value becomes part of the value - so every comment here is on its own line.

# --- WS2812 strip on SPI3 (2 LEDs per half, boards/jzf/cornix/cornix.dtsi) ---
CONFIG_SPI=y
CONFIG_LED_STRIP=y
# CONFIG_WS2812_STRIP_SPI defaults to y as soon as cornix_indicator.overlay
# enables the ws2812@0 node, so it is not forced here.
CONFIG_ZMK_EXT_POWER=y

# --- Widget core -------------------------------------------------------------
CONFIG_RGBLED_WIDGET=y
# WS2812 backend: multi-LED, per-status LED index, animations.  Without it the
# module falls back to upstream's single 3-GPIO-LED code and none of the
# options below exist.
CONFIG_RGBLED_WIDGET_WS2812=y
CONFIG_RGBLED_WIDGET_LED_COUNT=2
CONFIG_RGBLED_WIDGET_SPATIAL_MAPPING=y
CONFIG_RGBLED_WIDGET_ANIMATIONS=y

CONFIG_RGBLED_WIDGET_BRIGHTNESS=64
# Turn off the WS2812 power rail 1 second after the indicators become idle.
CONFIG_RGBLED_WIDGET_EXT_POWER_TIMEOUT_MS=1000

CONFIG_RGBLED_WIDGET_LED_SHARING=y

# --- Lit while on a cable, timed on battery (this shield's own symbol) -------
# CONFIG_CORNIX_INDICATOR_LEDS_ON_USB is `default y` in Kconfig.defconfig here
# and implemented by src/leds_on_usb.c, so it needs no line in this file.  While
# zmk_usb_is_powered() the two LEDs are re-asserted with a zero duration, which
# is what zmk-rgbled-widget treats as "persistent": they stay lit and the rail
# is never cut.  On battery the file does nothing and the timed behaviour above
# applies unchanged.  Add CONFIG_CORNIX_INDICATOR_LEDS_ON_USB=n for the old
# "flash once, then dark" behaviour on USB as well.

# --- Battery -----------------------------------------------------------------
# Each half shows its own battery only; in WS2812 mode the widget never reads
# peripheral battery levels, so the *_SHOW_PERIPHERALS options are inert.
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_SELF=y

# CRITICAL is deliberately raised to the same value as LOW.  The widget only
# *pulses* (visibly blinks) red at or below CRITICAL; between CRITICAL and LOW
# it shows a steady red.  RMK blinked red for "battery low", so everything at
# or below 20% blinks and the steady-red branch is unreachable by design.
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=80
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=20

# green above 80%, yellow 20-80%, red at or below 20%, magenta = no reading,
# green while charging (RMK used green for charging and for "charged").
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_HIGH=2
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_MEDIUM=3
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_LOW=1
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_CRITICAL=1
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_MISSING=5
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_CHARGING=2
CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=2000

# --- Connectivity ------------------------------------------------------------
# RMK profile colours: BT0 green, BT1 red, BT2 blue.  Cornix exposes three
# profiles; BT3/BT4 only become reachable if CONFIG_BT_MAX_PAIRED is raised.
CONFIG_RGBLED_WIDGET_CONN_COLOR_BT0=2
CONFIG_RGBLED_WIDGET_CONN_COLOR_BT1=1
CONFIG_RGBLED_WIDGET_CONN_COLOR_BT2=4
CONFIG_RGBLED_WIDGET_CONN_COLOR_BT3=3
CONFIG_RGBLED_WIDGET_CONN_COLOR_BT4=5
CONFIG_RGBLED_WIDGET_CONN_COLOR_BT_FALLBACK=7

# Split-link colours.  Only the peripheral halves use these; on the central
# the per-profile colour above is used instead.  RMK used blue for both link
# states, so both are blue.
CONFIG_RGBLED_WIDGET_CONN_COLOR_CONNECTED=4
CONFIG_RGBLED_WIDGET_CONN_COLOR_DISCONNECTED=4

# How long each connectivity state stays visible before the LED goes dark
# again (the rail is then cut by EXT_POWER_TIMEOUT_MS above).
CONFIG_RGBLED_WIDGET_CONN_CONNECTED_DURATION_MS=1500
CONFIG_RGBLED_WIDGET_CONN_DISCONNECTED_DURATION_MS=3000
# "Searching": an open/advertising profile pulses for this long.  RMK blinked
# until a host connected; raise this for a longer hint, at the cost of idle
# current.
CONFIG_RGBLED_WIDGET_CONN_ADV_DURATION_MS=5000
# Show the USB endpoint as cyan (CONN_COLOR_USB, index 6) when USB is the
# *selected* output, instead of leaving the connectivity LED dark.  RMK had no
# such state, but "which output am I typing on" is the whole point of keeping
# the LEDs lit on a cable (CONFIG_CORNIX_INDICATOR_LEDS_ON_USB above).
#
# This symbol also gates the module's `zmk_endpoint_changed` subscription
# (src/widget.c, ZMK_SUBSCRIPTION(led_output_listener, zmk_endpoint_changed) is
# compiled under `#if IS_ENABLED(CONFIG_RGBLED_WIDGET_CONN_SHOW_USB)`), so with
# it off the widget never re-renders when the output switches at all.
#
# It costs nothing on battery: with no cable the selected transport is BLE, so
# the USB branch is never taken.
CONFIG_RGBLED_WIDGET_CONN_SHOW_USB=y

# --- Features RMK did not have, kept off -------------------------------------
# Caps Lock defaults to y in the fork and would claim an LED (and select
# CONFIG_ZMK_HID_INDICATORS).
CONFIG_RGBLED_WIDGET_SHOW_CAPSLOCK=n
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=n
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=n
